name: openspec-validate

on:
  pull_request:
    paths:
      - 'openspec/changes/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start demo todo app
        run: |
          npm --prefix examples/demo-todo-app start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3210 >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Run OpenSpec validation
        run: node dist/cli/index.js validate "$GITHUB_WORKSPACE/examples/demo-todo-app/openspec/changes/add-todo-list" --target all
      - name: Comment validation.md
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('examples/demo-todo-app/openspec/changes/add-todo-list/validation.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
